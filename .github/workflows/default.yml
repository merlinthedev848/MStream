name: Build, Test and Publish
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci-testing
      - main
      - stable
      - 'dev-*'
    tags:
      - '*'
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sundays at 02:00
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without using cached Docker layers'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-test:
    name: PHP Test Suite
    runs-on: ubuntu-latest
    env:
      APPLICATION_ENV: testing
    steps:
      - uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, xdebug
          tools: composer:v2, cs2pr

      - name: Cache PHP dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.OS }}-build-${{ hashFiles('composer.lock') }}

      - name: Run Composer install
        run: |
          composer install --no-interaction --ignore-platform-reqs

      - name: Run PHP Linter
        run: |
          vendor/bin/parallel-lint . --exclude vendor --checkstyle | cs2pr

      - name: Build Codeception actors
        run: |
          vendor/bin/codecept build

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyze --memory-limit=-1 --error-format=checkstyle | cs2pr

      - name: Run PHP Code Sniffer
        run: |
          vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run Unit Tests
        run: |
          vendor/bin/codecept run Unit --no-interaction

      - name: Check Added DB Migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          php backend/bin/console mstream:dev:check-migrations "$BASE_SHA"

  node-test:
    name: Node Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/jod"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Lint and check styling
        run: npm run ci

      - name: Check TypeScript types
        run: npm run tsc

  prepare:
    name: Prepare Codebase
    needs:
      - php-test
      - node-test
    runs-on: ubuntu-latest
    env:
      APPLICATION_ENV: testing
      NODE_ENV: production
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, xdebug
          tools: composer:v2, cs2pr

      - name: Cache PHP dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.OS }}-build-${{ hashFiles('composer.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/jod"
          cache: "npm"

      - name: Set console permissions and clear static assets.
        run: |
          rm -rf web/static/vite_dist
          chmod a+x backend/bin/*

      - name: Run Composer install
        run: |
          composer install --no-interaction --ignore-platform-reqs

      - name: Generate and import locales, build static assets.
        run: |
          npm ci --include=dev
          backend/bin/console mstream:locale:generate || backend/bin/console locale:generate
          backend/bin/console mstream:locale:import || backend/bin/console locale:import
          npm run build

      - name: Build OpenAPI Docs
        run: backend/bin/console mstream:api:docs

      - name: Write .gitinfo File
        run: |
          bash util/write_git_info.sh
          chmod 777 .gitinfo

      - name: Upload built static assets and translations
        uses: actions/upload-artifact@v4
        with:
          name: assets
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .gitinfo
            translations
            web/static/vite_dist
            web/static/openapi.yml

  build:
    name: Build & Publish
    needs: prepare
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@master

      - name: Download built static assets from previous step
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/mstream
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push MStream Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
