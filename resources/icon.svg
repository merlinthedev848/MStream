<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Stream Gradient -->
    <linearGradient id="streamGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Flow Accent Gradient -->
    <linearGradient id="flowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="url(#streamGlow)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Sound Horizon Grid Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Stream Broadcast Waves (Right Side) -->
  <path d="M 124 74 A 36 36 0 0 1 124 126" fill="none" stroke="url(#streamGlow)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 142 58 A 58 58 0 0 1 142 142" fill="none" stroke="url(#streamGlow)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M 160 42 A 80 80 0 0 1 160 158" fill="none" stroke="url(#streamGlow)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Stream Broadcast Waves (Left Side) -->
  <path d="M 76 74 A 36 36 0 0 0 76 126" fill="none" stroke="url(#streamGlow)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 58 58 A 58 58 0 0 0 58 142" fill="none" stroke="url(#streamGlow)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M 40 42 A 80 80 0 0 0 40 158" fill="none" stroke="url(#streamGlow)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Core 'M' Dynamic Stream Icon -->
  <g filter="url(#glowFilter)">
    <!-- Stylized Modern M Waveform -->
    <path d="M 68 138 L 68 76 L 100 112 L 132 76 L 132 138" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Audio Pulse Core & Transmitter Pillar -->
    <circle cx="100" cy="54" r="7" fill="url(#flowAccent)"/>
    <line x1="100" y1="64" x2="100" y2="104" stroke="url(#flowAccent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 5"/>
  </g>
</svg>
