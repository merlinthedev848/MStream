<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Rounded Background -->
  <rect x="2" y="2" width="796" height="196" rx="20" fill="url(#bannerBg)" stroke="#312e81" stroke-width="2"/>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(40, 20)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="160" height="160" rx="38" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2.5"/>

    <!-- Radio Arcs -->
    <path d="M 100 60 A 30 30 0 0 1 100 100" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 115 48 A 48 48 0 0 1 115 112" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 130 36 A 66 66 0 0 1 130 124" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.45"/>

    <path d="M 60 60 A 30 30 0 0 0 60 100" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 45 48 A 48 48 0 0 0 45 112" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 30 36 A 66 66 0 0 0 30 124" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.45"/>

    <!-- M Core & Transmitter -->
    <g filter="url(#softGlow)">
      <path d="M 56 112 L 56 64 L 80 92 L 104 64 L 104 112" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="46" r="5" fill="#38bdf8"/>
      <line x1="80" y1="54" x2="80" y2="86" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(235, 96)">
    <!-- Main Logotype: MStream -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="400" fill="#f8fafc" letter-spacing="-1">
      M<tspan font-weight="800" fill="url(#streamGrad)">Stream</tspan>
    </text>

    <!-- Subtitle: BROADCAST MANAGEMENT SUITE -->
    <text x="4" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="6">
      BROADCAST MANAGEMENT SUITE
    </text>
  </g>

  <!-- Live STL / DAB Indicator Badge -->
  <g transform="translate(630, 36)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="5" fill="#10b981"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc" letter-spacing="1">DAB / STL READY</text>
  </g>
</svg>
