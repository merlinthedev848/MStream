services:
  installer:
    container_name: mstream_installer
    image: '${MSTREAM_IMAGE:-ghcr.io/merlinthedev848/mstream}:${MSTREAM_VERSION:-latest}'
    volumes:
      - './:/installer'
    restart: 'no'
    # Lightweight PHP installer (env + compose rewrite). Do not use mstream_install here:
    # that boots the full CLI/DI stack and tries Redis before the stack exists.
    entrypoint: docker_installer
    command: install
    privileged: true
