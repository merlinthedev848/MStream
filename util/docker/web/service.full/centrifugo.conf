[program:centrifugo]
directory=/var/mstream/centrifugo
command=centrifugo -c /var/mstream/centrifugo/config.toml
user=mstream
priority=700
numprocs=1
autostart=false
autorestart=true

stopasgroup=true
killasgroup=true

stdout_logfile=/var/mstream/www_tmp/service_centrifugo.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true

stdout_events_enabled = true
stderr_events_enabled = true
