[program:sftpgo]
directory=/var/mstream/sftpgo
command=sftpgo --config-dir=/var/mstream/sftpgo serve -l ""
user=mstream
priority=700
numprocs=1
autostart=false
autorestart=true

stopasgroup=true
killasgroup=true

stdout_logfile=/var/mstream/www_tmp/service_sftpgo.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true

stdout_events_enabled = true
stderr_events_enabled = true
